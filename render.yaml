services:
  - type: web
    name: daem
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
# NOTA: En el plan gratuito de Render no hay disco persistente, por lo que la
# base de datos SQLite se reinicia en cada deploy/reinicio. Para persistencia
# real, cambia plan: starter (de pago) y descomenta el bloque disk de abajo.
# disk:
#   name: daem-data
#   mountPath: /app/data
#   sizeGB: 1
# y agrega la variable DB_PATH=/app/data/daem.db
